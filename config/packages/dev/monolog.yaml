monolog:
    handlers:
        # this "file_log" key could be anything
        file_log:
            type: stream
            # log to var/log/(environment).log
            path: "%kernel.logs_dir%/%kernel.environment%.log"
            # log *all* messages (debug is lowest level)
            level: error

        syslog_handler:
            type: syslog
            # log error-level messages and higher
            level: error

        ecs:
            type: stream
            path: "%kernel.logs_dir%/ecs_%kernel.environment%.log"
            level: info
            formatter: 'owl.monolog.formatter.ecs'