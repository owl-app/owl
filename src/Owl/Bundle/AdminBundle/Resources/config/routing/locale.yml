owl_admin_locale:
    resource: |
        alias: owl.locale
        section: admin
        templates: "@OwlAdmin\\shared\\crud"
        except: ['show', 'create', 'update']
        redirect: index
        grid: owl_admin_locale
        permission: true
        vars:
            index:
                referer: true
                icon: flag
                permission:
                    group: locale
                    description: owl.ui.permission.list_locales
            delete:
                permission:
                    group: locale
                    description: owl.ui.permission.delete_locale
    type: sylius.resource

owl_admin_locale_create:
    path: /locales/new
    methods: [GET,POST]
    defaults:
        _controller: owl.controller.locale::createAction
        _sylius:
            section: admin
            permission: true
            template: "@OwlAdmin/shared/crud/modal/create.html.twig"
            vars:
                serialization_groups: [AjaxShow]
                form:
                    ajax: true
                tinymce: true
                permission:
                    group: locale
                    description: owl.ui.permission.create_locale
