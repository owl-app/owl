owl_admin_admin_user:
    resource: |
        alias: owl.admin_user
        section: admin
        path: users
        templates: "@OwlAdmin\\shared\\crud"
        except: ['show']
        redirect: index
        grid: owl_admin_admin_user
        permission: true
        vars:
            all:
                subheader: owl.ui.manage_users_able_to_access_administration_panel
                templates:
                    form: "@OwlAdmin/AdminUser/_form.html.twig"
                redirect:
                    optional_referer: owl_admin_admin_user_index
            index:
                icon: users
                referer: true
                permission:
                    group: user
                    description: owl.ui.permission.list_users
            create:
                form:
                    ajax: true
                permission:
                    group: user
                    description: owl.ui.permission.create_user
            update:
                form:
                    ajax: true
                permission:
                    group: user
                    description: owl.ui.permission.update_user
            bulkDelete:
                redirect:
                    header: xhr
                form:
                    ajax: true
                permission:
                    group: user
                    description: owl.ui.permission.bulk_delete_user
    type: sylius.resource

owl_admin_admin_user_permissions:
    path: /users/{id}/permissions
    methods: [GET]
    defaults:
        _controller: owl.controller.admin_user_permission::availablesAction
        _sylius:
            section: admin
            permission: true
            template: "@OwlAdmin/admin_user/permissions.html.twig"
            form: Owl\Bundle\RbacBundle\Form\Type\AssignType
            vars:
                subheader: owl.ui.manage_user_permissions
                icon: cube
                permission:
                    group: user
                    description: owl.ui.permission.list_permissions_assign_to_user

owl_admin_admin_user_permission_assign:
    path: /users/{id}/assign
    methods: [POST]
    defaults:
        _controller: owl.controller.admin_user_permission::assignAction
        _format: json
        _sylius:
            serialization_groups: [ADD]
            form: Owl\Bundle\RbacBundle\Form\Type\AssignType
            section: admin
            permission: true
            vars:
                route:
                    parameters:
                        id: $id
                form:
                  ajax: true
                permission:
                    group: user
                    description: owl.ui.permission.assign_permission_to_user

owl_admin_admin_user_permission_revoke:
    path: /users/{id}/revoke
    methods: [DELETE]
    defaults:
        _controller: owl.controller.admin_user_permission::revokeAction
        _format: json
        _sylius:
            serialization_groups: [DELETE]
            form: Owl\Bundle\RbacBundle\Form\Type\AssignType
            section: admin
            permission: true
            vars:
                route:
                    parameters:
                        id: $id
                form:
                  ajax: true
                permission:
                    group: user
                    description: owl.ui.permission.revoke_permission_to_user

owl_admin_confirm_registration:
    path: /{id}/registration
    methods: [GET]
    defaults:
        _controller: owl.controller.admin_user::updateAction
        _sylius:
            section: admin
            permission: true
            template: "@OwlAdmin/AdminUser/Registration/details.html.twig"
            vars:
                header: owl.ui.registration
                icon: user
                permission:
                    group: user
                    description: owl.ui.permission.registration
