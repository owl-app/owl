owl_admin_rbac_permission_availables:
    path: /availables
    methods: [GET]
    defaults:
        _controller: owl.controller.rbac_permission::availablesAction
        _sylius:
            section: admin
            permission: true
            # grid: owl_admin_service
            template: "@OwlAdmin/rbac/permission/available.html.twig"
            form: Owl\Bundle\RbacBundle\Form\Type\AvailablePermissionType
            vars:
                subheader: owl.ui.manage_permissions_in_system
                icon: lock
                permission:
                    group: rbac_permission_availables
                    description: owl.ui.permission.list_permission_availables_in_system

owl_admin_rbac_permission_add:
    path: /add
    methods: [POST]
    defaults:
        _controller: owl.controller.rbac_permission::addAction
        _format: json
        _sylius:
            form: Owl\Bundle\RbacBundle\Form\Type\AvailablePermissionType
            section: admin
            permission: true
            vars:
                form:
                  ajax: true
                serialization_groups: [ADD]
                permission:
                    group: rbac_permission_availables
                    description: owl.ui.permission.add_permission_to_system

owl_admin_rbac_permission_remove:
    path: /{name}
    methods: [DELETE]
    defaults:
        _controller: owl.controller.rbac_permission::removeAction
        _format: json
        _sylius:
            section: admin
            permission: true
            repository:
                method: findOneByName
                arguments:
                    name: $name
            vars:
                form:
                  ajax: true
                serialization_groups: [DELETE]
                permission:
                    group: rbac_permission_availables
                    description: owl.ui.permission.remove_permission_to_system