owl_admin_contractor:
    resource: |
        alias: owl.company
        section: admin
        path: companies
        templates: "@OwlAdmin\\shared\\crud\\modal"
        except: ['show', 'index']
        redirect: index
        grid: owl_admin_company
        permission: true
        vars:
            all:
                redirect:
                    optional_referer: owl_admin_company_index
            create:
                serialization_groups: [AjaxShow]
                form:
                    ajax: true
                permission:
                    group: company
                    description: owl.ui.permission.create_company
            update:
                form:
                    ajax: true
                permission:
                    group: company
                    description: owl.ui.permission.update_company
            delete:
                form:
                    ajax: true
                permission:
                    group: company
                    description: owl.ui.permission.delete_company
            bulkDelete:
                redirect:
                    header: xhr
                form:
                    ajax: true
                permission:
                    group: company
                    description: owl.ui.permission.bulk_delete_company
    type: sylius.resource

owl_admin_company_index:
    path: /companies/
    methods: [GET]
    defaults:
        _controller: owl.controller.company::indexAction
        _sylius:
            section: admin
            permission: true
            grid: owl_admin_company
            template: "@OwlAdmin/shared/crud/index.html.twig"
            vars:
                referer: true
                permission:
                    group: company
                    description: owl.ui.permission.list_companies
