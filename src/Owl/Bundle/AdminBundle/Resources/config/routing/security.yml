owl_admin_login:
    path: /{_locale}
    methods: [GET]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _locale: "%locale%"
        _controller: owl_core.controller.security::loginAction
        _sylius:
            template: "@OwlAdmin/security/login.html.twig"
            logged_in_route: owl_admin_dashboard

owl_admin_login_check:
    path: /login-check
    methods: [POST]
    defaults:
        _controller: owl_core.controller.security::checkAction

owl_admin_logout:
    path: /logout
    methods: [GET]

owl_admin_register:
    path: /{_locale}/register
    methods: [GET, POST]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _locale: "%locale%"
        _controller: owl.controller.admin_user::createAction
        _sylius:
            template: "@OwlAdmin/security/register.html.twig"
            form: Owl\Bundle\CoreBundle\Form\Type\User\AdminUserRegistrationType
            event: register
            redirect: 
                route: owl_admin_login
                parameters: []
                xhr: true
            flash: owl.admin.register
            vars:
                form:
                    ajax: true

owl_admin_user_verification:
    path: /verify/{token}
    methods: [GET]
    defaults:
        _controller: owl.controller.admin_user::verifyAction
        _sylius:
            redirect: owl_admin_dashboard

owl_admin_render_reset_password_page:
    path: /{_locale}/forgotten-password
    methods: [GET]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _controller: owl_admin.controller.account.render_request_password_reset_page
        _locale: "%locale%"

owl_admin_request_password_reset:
    path:  /{_locale}/forgotten-password
    methods: [POST]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _controller: owl_admin.controller.account.request_password_reset
        _locale: "%locale%"

owl_admin_render_password_reset:
    path: /{_locale}/forgotten-password/{token}
    methods: [GET]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _controller: owl_admin.controller.account.render_reset_password_page
        _locale: "%locale%"

owl_admin_password_reset:
    path: /{_locale}/forgotten-password/{token}
    methods: [POST]
    requirements:
        _locale: ^[A-Za-z]{2,4}(_([A-Za-z]{4}|[0-9]{3}))?(_([A-Za-z]{2}|[0-9]{3}))?$
    defaults:
        _controller: owl_admin.controller.account.reset_password
        _locale: "%locale%"