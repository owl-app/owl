sylius_twig_hooks:
    hooks:
        'owl_admin.common.component.sidebar':
            logo:
                template: '@OwlAdmin/shared/crud/common/sidebar/logo.html.twig'
                priority: 200
            toggle_button:
                template: '@OwlAdmin/shared/crud/common/sidebar/toggle_button.html.twig'
                priority: 100
            menu:
                template: '@OwlAdmin/shared/crud/common/sidebar/menu.html.twig'
                priority: 0

        'owl_admin.common.component.sidebar.logo':
            image:
                template: '@OwlAdmin/shared/crud/common/sidebar/logo/image.html.twig'
                priority: 0
