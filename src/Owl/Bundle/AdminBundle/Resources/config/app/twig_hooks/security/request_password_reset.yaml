sylius_twig_hooks:
    hooks:
        'owl_admin.security.request_password_reset':
            page:
                template: '@OwlAdmin/security/common/page.html.twig'
                priority: 0

        'owl_admin.security.request_password_reset.page':
            logo:
                template: '@OwlAdmin/security/common/logo.html.twig'
                priority: 100
            content:
                template: '@OwlAdmin/security/common/content.html.twig'
                priority: 0

        'owl_admin.security.request_password_reset.page.logo':
            image:
                template: '@OwlAdmin/security/common/logo/image.html.twig'
                priority: 0

        'owl_admin.security.request_password_reset.page.content':
            form:
                template: '@OwlAdmin/security/request_password_reset/page/form.html.twig'
                priority: 0

        'owl_admin.security.request_password_reset.page.content.form':
            email:
                template: '@OwlAdmin/security/request_password_reset/page/form/email.html.twig'
                priority: 100
            submit:
                template: '@OwlAdmin/security/request_password_reset/page/form/submit.html.twig'
                priority: 0
