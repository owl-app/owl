sylius_twig_hooks:
    hooks:
        'owl_admin.common.modal.update':
            sidebar:
                template: '@OwlAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@OwlAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@OwlAdmin/shared/crud/common/content.html.twig'
                priority: 0

        'owl_admin.common.modal.update.content':
            flashes:
                template: '@OwlAdmin/shared/crud/common/content/flashes.html.twig'
                priority: 400
            header:
                template: '@OwlAdmin/shared/crud/common/content/header.html.twig'
                priority: 300
            form_error_alert:
                template: '@OwlAdmin/shared/crud/common/content/form_error_alert.html.twig'
                priority: 200
            form:
                template: '@OwlAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    render_rest: true
                priority: 100
            footer:
                template: '@OwlAdmin/shared/crud/common/content/footer.html.twig'
                priority: -100

        'owl_admin.common.modal.update.content.header':
            breadcrumbs:
                template: '@OwlAdmin/shared/crud/update/content/header/breadcrumbs.html.twig'
                priority: 100
            title_block:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block.html.twig'
                priority: 0

        'owl_admin.common.modal.update.content.header.title_block':
            title:
                template: '@OwlAdmin/shared/crud/update/content/header/title_block/title.html.twig'
                priority: 100
            actions:
                template: '@OwlAdmin/shared/crud/update/content/header/title_block/actions.html.twig'
                priority: 0

        'owl_admin.common.modal.update.content.header.title_block.actions':
            show:
                template: '@OwlAdmin/shared/crud/update/content/header/title_block/actions/show.html.twig'
                priority: 200
            cancel:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block/actions/cancel.html.twig'
                priority: 100
            update:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block/actions/update.html.twig'
                priority: 0

        'owl_admin.common.modal.update.content.form':
            sections:
                template: '@OwlAdmin/shared/crud/common/content/form/sections.html.twig'
                priority: 0
                
        'owl_admin.common.modal.update.content.form.sections':
            general:
                template: '@OwlAdmin/shared/crud/common/content/form/sections/general.html.twig'      
                priority: 0

        'owl_admin.common.modal.update.content.form.sections.general':
            default:
                template: '@OwlAdmin/shared/crud/common/content/form/sections/general/default.html.twig'       
                priority: 0
