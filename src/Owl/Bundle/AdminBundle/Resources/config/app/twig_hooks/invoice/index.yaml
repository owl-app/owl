sylius_twig_hooks:
    hooks:
        'owl_admin.invoice.index.content.grid':
            custom_filters:
                component: 'owl_admin:invoice:grid_filters:form'
                props:
                    form: '@=_context.form'
                    template: '@OwlAdmin/shared/crud/index/content/grid/custom_filters.html.twig'
                configuration:
                    render_rest: true
                priority: 300

        'owl_admin.invoice.index.content.grid.data_table_after':
            summary:
                template: '@OwlAdmin/invoice/index/content/grid/summary.html.twig'
                priority: 0

        'owl_admin.invoice.index.content.grid.form':
            period:
                template: '@OwlAdmin/shared/grid/filter/custom/period.html.twig'
                configuration:
                    field: issueDate
                    route: owl_admin_invoice_index
                priority: 100
            company:
                template: '@OwlAdmin/shared/grid/filter/custom/autocomplete.html.twig'
                configuration:
                    field: company
                priority: 0