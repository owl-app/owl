sylius_twig_hooks:
    hooks:
        'owl_admin.common.create':
            sidebar:
                template: '@OwlAdmin/shared/crud/common/sidebar.html.twig'
                priority: 200
            navbar:
                template: '@OwlAdmin/shared/crud/common/navbar.html.twig'
                priority: 100
            content:
                template: '@OwlAdmin/shared/crud/common/content.html.twig'
                configuration:
                    stimulus:
                        controllers: {
                            form: {}
                        }
                priority: 0

        'owl_admin.common.create.content':
            flashes:
                template: '@OwlAdmin/shared/crud/common/content/flashes.html.twig'
                priority: 500
            header:
                template: '@OwlAdmin/shared/crud/common/content/header.html.twig'
                priority: 400
            form_error_alert:
                template: '@OwlAdmin/shared/crud/common/content/form_error_alert.html.twig'
                priority: 300
            body:
                template: '@OwlAdmin/shared/crud/common/content/body.html.twig'
                priority: 200
            footer:
                template: '@OwlAdmin/shared/crud/common/content/footer.html.twig'
                priority: -100

        'owl_admin.common.create.content.header':
            breadcrumbs:
                template: '@OwlAdmin/shared/crud/create/content/header/breadcrumbs.html.twig'
                priority: 100
            title_block:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block.html.twig'
                priority: 0

        'owl_admin.common.create.content.header.title_block':
            title:
                template: '@OwlAdmin/shared/crud/create/content/header/title_block/title.html.twig'
                priority: 100
            actions:
                template: '@OwlAdmin/shared/crud/create/content/header/title_block/actions.html.twig'
                priority: 0

        'owl_admin.common.create.content.header.title_block.actions':
            show:
                template: '@OwlAdmin/shared/crud/update/content/header/title_block/actions/show.html.twig'
                priority: 300
            cancel:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block/actions/cancel.html.twig'
                configuration:
                    hasForm: true
                priority: 200
            save_close:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block/actions/save.html.twig'
                configuration:
                    method: 'POST'
                    button:
                        text: 'owl.ui.save_close'
                        class: 'btn-primary'
                    saveAction: 'referer'
                priority: 100
            save_update:
                template: '@OwlAdmin/shared/crud/common/content/header/title_block/actions/save.html.twig'
                configuration:
                    method: 'POST'
                    button:
                        text: 'owl.ui.save_update'
                        class: 'btn-blue'
                    saveAction: 'update'
                priority: 0

        'owl_admin.common.create.content.body':
            form:
                template: '@OwlAdmin/shared/crud/common/content/body/form.html.twig'
                configuration:
                    render_rest: true
                priority: 0

        'owl_admin.common.create.content.body.form':
            sections:
                template: '@OwlAdmin/shared/crud/common/content/body/form/sections.html.twig'
                priority: 0

        'owl_admin.common.create.content.body.form.sections':
            general:
                template: '@OwlAdmin/shared/crud/common/content/body/form/sections/general.html.twig'
                priority: 0

        'owl_admin.common.create.content.body.form.sections.general':
            default:
                template: '@OwlAdmin/shared/crud/common/content/body/form/sections/general/default.html.twig'
                priority: 0
