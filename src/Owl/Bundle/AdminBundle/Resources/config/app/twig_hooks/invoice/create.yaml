sylius_twig_hooks:
    hooks:
        'owl_admin.invoice.create.content':
            header:
                template: '@OwlAdmin/shared/crud/common/content/header.html.twig'
                configuration:
                    full_width: true
                priority: 400
            body:
                template: '@OwlAdmin/shared/crud/common/content/body.html.twig'
                configuration:
                    full_width: true
                    page_body_attributes:
                        'data-form-target': 'content'
                priority: 200

        'owl_admin.invoice.create.content.body':
            form:
                component: 'owl_admin:invoice:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@OwlAdmin/invoice/form.html.twig'
                configuration:
                    render_rest: false
                priority: 0

        'owl_admin.common.create.content.body.form':
            header:
                template: '@OwlAdmin/invoice/form/header.html.twig'
                priority: 100
            sections:
                template: '@OwlAdmin/invoice/form/sections.html.twig'
                priority: 0

        # 'owl_admin.invoice.create.content.body.form.sections':
        #     general:
        #         enabled: false

        'owl_admin.invoice.create.content.body.form.sections.general':
            default:
                template: '@OwlAdmin/invoice/form/sections/general/default.html.twig'
                priority: 0
