sylius_grid:
    grids:
        owl_admin_country:
            driver:
                name: doctrine/orm
                options:
                    class: "%owl.model.country.class%"
            sorting:
                code: asc
            fields:
                name:
                    type: twig
                    label: owl.ui.name
                    path: .
                    sortable: code
                    options:
                        template: "@OwlAdmin/shared/grid/field/country.html.twig"
                code:
                    type: twig
                    label: owl.ui.code
                    sortable: ~
                    options:
                        template: "@OwlAdmin/shared/grid/field/code.html.twig"
                enabled:
                    type: twig
                    label: owl.ui.enabled
                    sortable: ~
                    options:
                        template: "@OwlAdmin/shared/grid/field/boolean.html.twig"
                        vars:
                            th_class: "w-1 text-center"
            filters:
                code:
                    type: string
                    label: owl.ui.code
                enabled:
                    type: boolean
                    label: owl.ui.enabled
            actions:
                main:
                    create:
                        type: modal
                        label: owl.ui.create
                        options:
                            button: primary
                            icon: flowbite:plus-outline
                            modal:
                                size: 'xl'
                            link:
                                route: owl_admin_country_create
                item:
                    update:
                        type: modal
                        options:
                            tooltip: owl.ui.edit
                            icon: flowbite:pen-solid
                            modal:
                                size: 'xl'
                            link:
                                route: owl_admin_country_update
                                parameters:
                                    id: resource.id
