sylius_grid:
    grids:
        owl_admin_invoice:
            driver:
                name: doctrine/orm
                options:
                    class: "%owl.model.invoice.class%"
            sorting:
                number: asc
            fields:
                number:
                    type: string
                    label: owl.ui.number
                    sortable: ~
                issueDate:
                    type: datetime
                    label: owl.invoice.issue_date
                    sortable: ~
                    options:
                        format: d-m-Y
                contractor:
                    type: string
                    label: owl.ui.contractor
                    path: buyer.company
                    sortable: buyer.company
            filters:
                number:
                    type: string
                    label: owl.ui.number
            actions:
                main:
                    create:
                        type: create
                item:
                    delete:
                        type: delete
