sylius_grid:
    grids:
        owl_admin_notification:
            driver:
                name: doctrine/orm
                options:
                    class: "%owl.model.notification.class%"
            sorting:
                dateIssue: desc
            fields:
                subject:
                    type: string
                    label: owl.ui.subject
                    sortable: ~
                description:
                    type: twig
                    label: owl.ui.description
                    sortable: ~
                    options:
                        template: "@OwlUi/grid/field/raw.html.twig"
                dateIssue:
                    type: datetime
                    label: owl.ui.date_issue
                    sortable: ~
                    options:
                        format: d-m-Y
                files:
                    type: twig
                    label: owl.ui.files
                    options:
                        template: "@OwlAdmin/shared/grid/field/files.html.twig"
                user:
                    type: twig
                    label: owl.ui.added_by
                    sortable: user.firstName
                    options:
                        template: "@OwlAdmin/shared/grid/field/user.html.twig"
            filters:
                search:
                    type: string
                    label: owl.ui.search
                    options:
                        fields: [subject, description]
                user:
                    type: string
                    form_options:
                        type: contains
                    label: owl.ui.user
                    options:
                        fields: [user.email, user.firstName, user.lastName]
            actions:
                main:
                    create:
                        type: modal
                        label: owl.ui.create
                        options:
                            button: primary
                            icon: flowbite:plus-outline
                            modal:
                                size: 'xl'
                                'has-tinymce': true
                            link:
                                route: owl_admin_notification_create
                item:
                    show:
                        type: show
                    update:
                        type: update
                    delete:
                        type: delete
