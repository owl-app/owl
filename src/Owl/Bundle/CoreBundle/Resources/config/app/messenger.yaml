parameters:
    env(OWL_MESSENGER_TRANSPORT_MAIN_DSN): 'doctrine://default'
    env(OWL_MESSENGER_TRANSPORT_MAIN_FAILED_DSN): 'doctrine://default?queue_name=main_failed'

    owl_messenger_transport_main_dsn: '%env(resolve:OWL_MESSENGER_TRANSPORT_MAIN_DSN)%'
    owl_messenger_transport_main_failed_dsn: '%env(resolve:OWL_MESSENGER_TRANSPORT_MAIN_FAILED_DSN)%'

framework:
    messenger:
        transports:
            main:
                dsn: '%owl_messenger_transport_main_dsn%'
                failure_transport: 'main_failed'
            main_failed:
                dsn: '%owl_messenger_transport_main_failed_dsn%'
        default_bus: owl.command_bus
        buses:
            owl.command_bus:
                middleware:
                    - 'validation'
                    - 'doctrine_transaction'
            owl.query_bus:
                middleware:
                    - validation
            owl.event_bus:
                default_middleware: allow_no_handlers
